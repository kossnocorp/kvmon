# Monorepo #####################################################################

monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]

[tools]

# Stack ########################################################################

# ...

[tasks.fmt]
description = "Format Rust workspace"
run = "cargo fmt --all"

[tasks.check]
description = "Check formatting and lint Rust workspace"
run = ["cargo fmt --all -- --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.test]
description = "Test shared behavior and backend parsers (no hardware writes)"
run = "cargo test --workspace"


# Settings #####################################################################

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml

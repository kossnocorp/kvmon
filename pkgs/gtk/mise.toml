[tasks.run]
description = "Run the GNOME monitor service"
run = "cargo run -p kvmon-gtk"

[tasks.probe]
description = "Discover the Dell and read its input (no writes)"
run = "cargo run -p kvmon-gtk -- --probe"

[tasks.build]
description = "Build the Rust GNOME service"
run = "cargo build --release -p kvmon-gtk"

[tasks.settings]
description = "Open the native connection-name settings window"
run = "cargo run -p kvmon-gtk -- --settings"

[tasks.smoke]
description = "Exercise D-Bus with a fake monitor in an isolated session"
run = "python3 scripts/smoke.py"
